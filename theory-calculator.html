<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theory Calculator Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.5; }
    nav { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    nav a { margin-right: 15px; text-decoration: none; color: blue; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    input[type="number"] { width: 60px; margin-right: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 5px; border-bottom: 1px solid #eee; }
    .error { color: red; font-size: 0.9em; }
    button { padding: 5px 10px; cursor: pointer; }
    .res-box { font-weight: bold; font-size: 1.2em; }
    footer { margin-top: 30px; border-top: 1px solid #ccc; padding-top: 10px; text-align: center; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>

<nav>
  <strong>GradeCalc Dashboard</strong> &nbsp;&nbsp;
  <a href="index.html">Full Course</a>
  <a href="theory-calculator.html">Theory Only</a>
</nav>

<h2>Theory Marks Calculator</h2>

<div class="card">
  <div>Mid (25): <input type="number" id="mid-obt"> / <input type="number" id="mid-tot" value="30"></div>
  <div>Final (50): <input type="number" id="fin-obt"> / <input type="number" id="fin-tot" value="50"></div>
  
  <h4>Quizzes (15%)</h4>
  <button onclick="addRow('quiz')">+ Add Quiz</button>
  <table id="quiz-table"><tr><th>Obtained</th><th>Total</th><th></th></tr><tbody id="quiz-body"></tbody></table>
  
  <h4>Assignments (10%)</h4>
  <button onclick="addRow('asgn')">+ Add Assignment</button>
  <table id="asgn-table"><tr><th>Obtained</th><th>Total</th><th></th></tr><tbody id="asgn-body"></tbody></table>
</div>

<button onclick="calculate()" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; font-size: 1.1em; border-radius: 5px;">Calculate Theory Score</button>
<div id="error-msg" class="error"></div>

<div id="results" class="card" style="display: none; margin-top: 20px; background: #f8f9fa;">
  <h3>Results</h3>
  <p>Theory Score: <span id="res-overall" class="res-box"></span> / 100</p>
  <p>Grade: <span id="res-grade" class="res-box"></span></p>
  
  <hr style="margin: 15px 0; border: none; border-top: 1px solid #ccc;">
  <h4>Target Predictor</h4>
  Desired Score: <input type="number" id="target" oninput="predict()" placeholder="e.g. 85">
  <div id="pred-res" style="margin-top: 10px; font-weight: 500;"></div>
</div>

<footer>
  <p>&copy; 2026 GradeCalc. Minimal UI Version.</p>
</footer>

<script>
let rows = { quiz: [], asgn: [] };
const GRADES = [
  { min: 85, label: 'A' }, { min: 80, label: 'A-' }, { min: 75, label: 'B+' }, 
  { min: 70, label: 'B' }, { min: 65, label: 'C+' }, { min: 60, label: 'C' }, 
  { min: 0, label: 'F' }
];

function addRow(type) {
  rows[type].push({ obt: '', tot: '10' });
  renderRows(type);
  save();
}
function delRow(type, i) {
  rows[type].splice(i, 1);
  renderRows(type);
  save();
}
function renderRows(type) {
  const tb = document.getElementById(type + '-body');
  tb.innerHTML = rows[type].map((r, i) => `
    <tr>
      <td><input type="number" value="${r.obt}" oninput="rows['${type}'][${i}].obt=this.value; save()"></td>
      <td><input type="number" value="${r.tot}" oninput="rows['${type}'][${i}].tot=this.value; save()"></td>
      <td><button onclick="delRow('${type}', ${i})">X</button></td>
    </tr>
  `).join('');
}

function sumRows(type) {
  let obt = 0, tot = 0;
  for (let r of rows[type]) {
    if (r.obt && r.tot) { obt += Number(r.obt); tot += Number(r.tot); }
  }
  return { obt, tot };
}

function val(id) { return Number(document.getElementById(id).value); }
function raw(id) { return document.getElementById(id).value; }

let calcRes = null;

function calculate() {
  document.getElementById('error-msg').innerText = '';
  
  let q = sumRows('quiz'), a = sumRows('asgn');
  
  let mid = raw('mid-obt') ? (val('mid-obt') / val('mid-tot')) * 25 : 0;
  let fin = raw('fin-obt') ? (val('fin-obt') / val('fin-tot')) * 50 : 0;
  let qSc = q.tot ? (q.obt / q.tot) * 15 : 0;
  let aSc = a.tot ? (a.obt / a.tot) * 10 : 0;
  let overall = mid + fin + qSc + aSc;

  let grade = GRADES.find(g => overall >= g.min).label;

  document.getElementById('results').style.display = 'block';
  document.getElementById('res-overall').innerText = overall.toFixed(2);
  document.getElementById('res-grade').innerText = grade;

  calcRes = { 
    thTotNoFin: mid + qSc + aSc, 
    finTot: val('fin-tot') || 50,
    overall
  };
  
  predict();
  save();
}

function predict() {
  if (!calcRes) return;
  let tgt = val('target');
  let res = document.getElementById('pred-res');
  if (!raw('target')) { res.innerText = ''; return; }
  
  let neededTFinScore = tgt - calcRes.thTotNoFin;
  let neededTFinMarks = (neededTFinScore / 50) * calcRes.finTot;
  
  if (calcRes.overall >= tgt) res.innerText = "Already achieved! 🎉";
  else if (neededTFinMarks > calcRes.finTot) res.innerText = "Impossible to achieve. ❌";
  else if (neededTFinMarks < 0) res.innerText = "Already achievable without final! 🎉";
  else res.innerText = `You need ${neededTFinMarks.toFixed(2)} / ${calcRes.finTot} in Final to hit ${tgt}.`;
}

function save() {
  let ids = ['mid-obt','mid-tot','fin-obt','fin-tot','target'];
  let data = { rows, fields: {} };
  ids.forEach(id => data.fields[id] = raw(id));
  localStorage.setItem('gradecalc_th_min', JSON.stringify(data));
}

function load() {
  try {
    let data = JSON.parse(localStorage.getItem('gradecalc_th_min'));
    if (!data) return;
    if (data.rows) rows = data.rows;
    if (data.fields) {
      for (let k in data.fields) {
        if(document.getElementById(k)) document.getElementById(k).value = data.fields[k];
      }
    }
  } catch(e) {}
  renderRows('quiz'); renderRows('asgn');
}

load();
</script>
</body>
</html>
