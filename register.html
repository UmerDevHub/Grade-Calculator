<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CUI Wah Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      border-radius: 0;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e3a8a;
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .auth-header p { color: var(--text-muted); font-size: 0.95rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 0;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease-in-out;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #bfdbfe;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 0;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      margin-top: 0.5rem;
    }
    .btn:hover { background: var(--primary-hover); }

    #error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        CUI Wah Hub
      </a>
      
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join with your CUI Registration Number</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="reg-number">Registration Number</label>
          <input type="text" id="reg-number" placeholder="FA23-BSE-053" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div id="error-msg">Invalid registration format. Use FA23-BSE-053 format.</div>
        <button type="submit" class="btn">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const regInput = document.getElementById('reg-number').value.trim();
      const regex = /^[A-Za-z]{2}\d{2}-[A-Za-z]{3}-\d{3}$/i;
      
      if (!regex.test(regInput)) {
        document.getElementById('error-msg').style.display = 'block';
      } else {
        document.getElementById('error-msg').style.display = 'none';
        window.location.href = 'login.html';
      }
    });
  </script>

</body>
</html>
